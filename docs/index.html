<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brisk — เบราว์เซอร์ที่เร็ว เบา และเป็นส่วนตัว</title>
    <meta name="description" content="Brisk: a fast, light and private web browser for Windows 11. Built-in ad blocking, sleeping tabs, no telemetry." />
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <meta property="og:title" content="Brisk" />
    <meta property="og:description" content="A fast, light and private web browser for Windows 11." />
    <style>
      /* Brisk's own tokens (app: src/styles.css), so the site looks like the app. */
      :root {
        --bg: #f5f6f8;
        --layer: #ffffff;
        --text: #1a1c21;
        --text-dim: #5b6070;
        --stroke: rgba(0, 0, 0, 0.08);
        --accent: #2f6fed;
        --accent-2: #5b8fff;
        --on-accent: #ffffff;
        --wind: rgba(47, 111, 237, 0.14);
        --ease: cubic-bezier(0.2, 0, 0, 1);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15161a;
          --layer: #1f2126;
          --text: #eceef3;
          --text-dim: #9aa0ad;
          --stroke: rgba(255, 255, 255, 0.08);
          --accent: #7cb4ff;
          --on-accent: #0c1424;
          --wind: rgba(124, 180, 255, 0.12);
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 "Segoe UI Variable Text", "Segoe UI", "Leelawadee UI", "Noto Sans Thai", system-ui, sans-serif;
      }
      a {
        color: var(--accent);
      }
      .wrap {
        width: min(1080px, 100% - 32px);
        margin: 0 auto;
      }

      /* --- header --- */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 64px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: inherit;
        font-weight: 600;
        font-size: 18px;
        text-decoration: none;
      }
      .brand img {
        width: 30px;
        height: 30px;
      }
      .lang {
        display: flex;
        gap: 2px;
        padding: 3px;
        border-radius: 999px;
        background: var(--layer);
        box-shadow: inset 0 0 0 1px var(--stroke);
      }
      .lang button {
        padding: 4px 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--text-dim);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .lang button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--on-accent);
      }

      /* --- hero --- */
      .hero {
        position: relative;
        padding: 72px 0 88px;
        text-align: center;
        overflow: hidden;
      }
      .wind {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .wind path {
        fill: none;
        stroke: var(--wind);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 1600;
        stroke-dashoffset: 1600;
        animation: sweep 2s var(--ease) forwards;
      }
      .wind path:nth-child(2) {
        animation-delay: 0.15s;
      }
      .wind path:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes sweep {
        to {
          stroke-dashoffset: 0;
        }
      }
      .hero > * {
        position: relative;
      }
      .hero .logo {
        width: 104px;
        height: 104px;
        filter: drop-shadow(0 14px 30px rgba(37, 86, 214, 0.35));
      }
      h1 {
        margin: 22px 0 8px;
        font: 700 clamp(36px, 6vw, 56px) / 1.1 "Segoe UI Variable Display", "Segoe UI", "Leelawadee UI", sans-serif;
        letter-spacing: -0.02em;
      }
      .tagline {
        max-width: 560px;
        margin: 0 auto;
        color: var(--text-dim);
        font-size: clamp(17px, 2.2vw, 20px);
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 32px;
        padding: 14px 30px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        box-shadow: 0 10px 26px -10px rgba(37, 86, 214, 0.7);
        color: var(--on-accent);
        font-weight: 600;
        font-size: 17px;
        text-decoration: none;
        transition: transform 0.15s var(--ease), filter 0.15s var(--ease);
      }
      .cta:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }
      .meta {
        margin-top: 12px;
        color: var(--text-dim);
        font-size: 13px;
      }

      /* --- features --- */
      .features {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
        margin: 0 0 72px;
        padding: 0;
        list-style: none;
      }
      .features li {
        padding: 22px;
        border-radius: 14px;
        background: var(--layer);
        box-shadow: inset 0 0 0 1px var(--stroke);
      }
      .features .ico {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        margin-bottom: 12px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        font-size: 20px;
      }
      .features h3 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      .features p {
        margin: 0;
        color: var(--text-dim);
        font-size: 14px;
      }

      /* --- requirements + footer --- */
      .req {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 28px;
        justify-content: center;
        margin-bottom: 64px;
        color: var(--text-dim);
        font-size: 14px;
      }
      .req b {
        color: var(--text);
      }
      footer {
        padding: 24px 0 40px;
        border-top: 1px solid var(--stroke);
        color: var(--text-dim);
        font-size: 13px;
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        .wind path {
          animation: none;
          stroke-dashoffset: 0;
        }
        .cta {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <a class="brand" href="./"><img src="logo.svg" alt="" />Brisk</a>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-set-lang="th">ไทย</button>
          <button type="button" data-set-lang="en">English</button>
        </div>
      </header>
    </div>

    <section class="hero">
      <svg class="wind" viewBox="0 0 1200 460" preserveAspectRatio="none" aria-hidden="true">
        <path d="M-40 150 C 200 80, 420 240, 640 150 S 1000 70, 1240 140" />
        <path d="M-40 230 C 240 160, 460 320, 700 230 S 1020 160, 1240 220" />
        <path d="M-40 310 C 180 260, 420 390, 660 310 S 1000 250, 1240 300" />
      </svg>
      <img class="logo" src="logo.svg" alt="Brisk" />
      <h1>Brisk</h1>
      <p class="tagline" data-i18n="tagline"></p>
      <a class="cta" href="https://github.com/koharuame/brisk-browser/releases/latest"><span aria-hidden="true">⬇</span><span data-i18n="download"></span></a>
      <p class="meta" data-i18n="meta"></p>
    </section>

    <main class="wrap">
      <ul class="features" id="features"></ul>
      <div class="req" id="req"></div>
    </main>

    <footer>
      <div class="wrap"><span data-i18n="footer"></span> · <a href="https://github.com/koharuame/brisk-browser/releases">Releases</a></div>
    </footer>

    <script>
      const STRINGS = {
        th: {
          title: "Brisk — เบราว์เซอร์ที่เร็ว เบา และเป็นส่วนตัว",
          tagline: "เบราว์เซอร์ที่เร็ว เบา และเป็นส่วนตัว สำหรับ Windows 11 บล็อกโฆษณาในตัว ไม่เก็บข้อมูลคุณ",
          download: "ดาวน์โหลดสำหรับ Windows",
          meta: "ฟรี · Windows 11 (64 บิต)",
          features: [
            ["🛡️", "บล็อกโฆษณาในตัว", "บล็อกโฆษณาและตัวติดตามก่อนโหลด และเตือนเว็บมัลแวร์หรือฟิชชิงก่อนเข้า"],
            ["🌙", "พักแท็บอัตโนมัติ", "แท็บที่ไม่ได้ใช้คืนหน่วยความจำให้เครื่อง กลับมากดเมื่อไรก็อยู่ที่เดิม"],
            ["🔒", "เป็นส่วนตัวตั้งแต่ต้น", "ไม่มี telemetry ประวัติและรหัสผ่านอยู่ในเครื่องคุณเท่านั้น"],
            ["🔑", "ตัวจัดการรหัสผ่าน", "เข้ารหัสด้วยรหัสผ่านหลักของคุณ เติมให้เมื่อคุณเลือกเท่านั้น"],
            ["🪟", "จัดหน้าต่างได้ตามใจ", "ดึงแท็บออกเป็นหน้าต่างใหม่ ลากกลับ และจัดกลุ่มแท็บ"],
            ["🧩", "ส่วนขยาย Chrome", "ติดตั้งส่วนขยายจาก Chrome Web Store ได้"],
            ["👤", "หลายโปรไฟล์", "แยกงาน แยกเล่น คุกกี้และการล็อกอินไม่ปนกัน"],
            ["⚡", "อัปเดตในตัว", "ตรวจหาเวอร์ชันใหม่ให้เอง กดอัปเดตจากหน้าตั้งค่าได้เลย"],
          ],
          req: [["ระบบ", "Windows 11 (64 บิต)"], ["เอนจิน", "Microsoft Edge WebView2 (ลงให้อัตโนมัติ)"], ["พื้นที่", "100 MB ขึ้นไป"]],
          footer: "© Brisk",
        },
        en: {
          title: "Brisk — a fast, light and private browser",
          tagline: "A fast, light and private web browser for Windows 11. Ad blocking built in, nothing about you collected.",
          download: "Download for Windows",
          meta: "Free · Windows 11 (64-bit)",
          features: [
            ["🛡️", "Built-in ad blocking", "Ads and trackers blocked before they load, plus malware and phishing warnings"],
            ["🌙", "Sleeping tabs", "Tabs you're not using give memory back, and pick up where you left off"],
            ["🔒", "Private by design", "No telemetry. History and passwords stay on your PC"],
            ["🔑", "Password manager", "Encrypted with your master password, filled only when you choose"],
            ["🪟", "Your windows, your way", "Tear tabs off into windows, drag them back, group them"],
            ["🧩", "Chrome extensions", "Install extensions from the Chrome Web Store"],
            ["👤", "Profiles", "Keep work and play apart: separate cookies and sign-ins"],
            ["⚡", "Built-in updates", "Brisk checks for new versions; update from Settings"],
          ],
          req: [["System", "Windows 11 (64-bit)"], ["Engine", "Microsoft Edge WebView2 (installed for you)"], ["Disk", "100 MB or more"]],
          footer: "© Brisk",
        },
      };

      function setLang(lang) {
        const s = STRINGS[lang];
        document.documentElement.lang = lang;
        document.title = s.title;
        document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = s[el.dataset.i18n]));
        document.querySelectorAll("[data-set-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.setLang === lang)));
        document.getElementById("features").replaceChildren(
          ...s.features.map(([ico, title, text]) => {
            const li = document.createElement("li");
            li.innerHTML = '<div class="ico" aria-hidden="true"></div><h3></h3><p></p>';
            li.querySelector(".ico").textContent = ico;
            li.querySelector("h3").textContent = title;
            li.querySelector("p").textContent = text;
            return li;
          }),
        );
        document.getElementById("req").replaceChildren(
          ...s.req.map(([k, v]) => {
            const span = document.createElement("span");
            const b = document.createElement("b");
            b.textContent = `${k}: `;
            span.append(b, v);
            return span;
          }),
        );
        try {
          localStorage.setItem("lang", lang);
        } catch {}
      }

      document.querySelectorAll("[data-set-lang]").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.setLang)));
      let saved = null;
      try {
        saved = localStorage.getItem("lang");
      } catch {}
      setLang(saved || (navigator.language.toLowerCase().startsWith("th") ? "th" : "en"));
    </script>
  </body>
</html>
